<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,follow" />
    <meta http-equiv="refresh" content="0; url=https://hongyidu.ai/" />
    <link rel="canonical" href="https://hongyidu.ai/" />
    <title>Page moved — Hongyi Du</title>
    <script>
      (() => {
        const target = new URL("https://hongyidu.ai/");
        const current = new URL(window.location.href);
        target.search = current.search;
        if (!target.hash) target.hash = current.hash;
        window.location.replace(target.href);
      })();
    </script>
    <style>
      :root { color-scheme: light dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b111b; color: #e8eef8; }
      main { width: min(36rem, calc(100% - 3rem)); border: 1px solid #334155; padding: 2rem; background: #111a29; }
      p { color: #a9b7cc; line-height: 1.7; }
      a { color: #8bdff1; }
    </style>
  </head>
  <body>
    <main>
      <h1>This page has moved.</h1>
      <p>Hongyi Du's research website now lives at <a href="https://hongyidu.ai/">https://hongyidu.ai/</a>.</p>
    </main>
  </body>
</html>
